<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juice Guard – Account</title>
<link rel="stylesheet" href="common.css">
<style> main { max-width: 560px; } .card { margin-top: 16px; } dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0; } dt { color: var(--muted); } dd { margin: 0; } </style>
</head>
<body>
<main>
  <h1>Account</h1>

  <section class="card">
    <dl>
      <dt>Name</dt><dd id="aName">–</dd>
      <dt>Email</dt><dd id="aEmail">–</dd>
      <dt>Role</dt><dd id="aRole">–</dd>
      <dt>Member since</dt><dd id="aCreated">–</dd>
      <dt>Last login</dt><dd id="aLast">–</dd>
    </dl>
  </section>

  <section class="card">
    <b>Change password</b>
    <div class="muted">This also logs you out on every other browser.</div>
    <form id="pwForm">
      <label for="pwCur">Current password</label>
      <input id="pwCur" type="password" autocomplete="current-password" required>
      <label for="pwNew">New password</label>
      <input id="pwNew" type="password" autocomplete="new-password" required minlength="8" maxlength="72">
      <div class="muted" style="margin-top:4px">At least 8 characters, with a letter and a digit.</div>
      <label for="pwNew2">Repeat new password</label>
      <input id="pwNew2" type="password" autocomplete="new-password" required>
      <button class="primary" style="margin-top:14px">Change password</button>
      <div class="msg" id="pwMsg"></div>
    </form>
  </section>

  <section class="card">
    <b>Log out everywhere</b>
    <div class="muted">Ends your session on every browser and device, including this one.</div>
    <button id="logoutAll" class="danger" style="margin-top:10px">Log out everywhere</button>
    <div class="msg" id="loMsg"></div>
  </section>
</main>

<script src="common.js"></script>
<script>
(async () => {
  const me = await requireLogin({ active: "account" });
  $("aName").textContent = me.full_name;
  $("aEmail").textContent = me.email;
  $("aRole").textContent = me.role === "admin" ? "Administrator" : "Station host";
  $("aCreated").textContent = fmtTs(me.created_at);
  $("aLast").textContent = fmtTs(me.last_login_at);
})();

$("pwForm").onsubmit = async e => {
  e.preventDefault();
  if ($("pwNew").value !== $("pwNew2").value) return showMsg($("pwMsg"), "New passwords don't match.");
  const btn = e.submitter || e.target.querySelector("button"); btn.disabled = true;
  try {
    await api("/api/auth/change-password", { method: "POST",
      body: { current_password: $("pwCur").value, new_password: $("pwNew").value } });
    showMsg($("pwMsg"), "Password changed. Other browsers have been logged out.", true);
    $("pwForm").reset();
  } catch (err) { showMsg($("pwMsg"), err.message); }
  btn.disabled = false;
};

$("logoutAll").onclick = async () => {
  if (!confirm("Log out on every browser and device?")) return;
  try {
    await api("/api/auth/logout-all", { method: "POST" });
    location.href = "login.html";
  } catch (err) { showMsg($("loMsg"), err.message); }
};
</script>
</body>
</html>
