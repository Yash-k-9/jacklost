<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juice Guard – Admin</title>
<link rel="stylesheet" href="common.css?v=4">
<style>
  /* ---- console header ---- */
  .console { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; margin-bottom: 22px; }
  .console h1 { margin-top: 10px; }
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; }
  .kpi { min-width: 108px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border);
         background: linear-gradient(180deg, var(--surface-2), var(--surface)); }
  .kpi small { display: block; font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .kpi b { font: 700 24px/1.2 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .kpi.volt b { color: var(--volt); } .kpi.warn b { color: var(--warn); }

  .tabs button .n { font: 600 11px var(--mono); margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: rgba(255, 255, 255, .06); color: var(--muted); }
  .tabs button.on .n { background: var(--volt-dim); color: var(--volt); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .bar .grow { flex: 1; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: rgba(0, 0, 0, .35); border: 1px solid var(--border); }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 13px; font-size: 13px; border-radius: 8px; box-shadow: none; }
  .seg button:hover { background: transparent; color: var(--text); }
  .seg button.on { background: var(--surface-3); color: var(--text); }
  .search { position: relative; min-width: 240px; }
  .search input { padding-left: 36px; }
  .search svg { position: absolute; left: 12px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--muted); }

  /* ---- people cards ---- */
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .person { position: relative; padding: 18px; border-radius: 20px; border: 1px solid var(--border); overflow: hidden;
            background: linear-gradient(180deg, var(--surface-2), var(--surface)); box-shadow: var(--shadow); }
  .person.off { opacity: .62; }
  .person.admin { border-color: rgba(200, 255, 61, .2); }
  .person-top { display: flex; gap: 13px; align-items: center; }
  .person-top .avatar { width: 46px; height: 46px; border-radius: 14px; font-size: 16px; }
  .person-top .txt { min-width: 0; flex: 1; }
  .person-top b { display: block; font: 600 16px var(--display); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .person-top .txt span { display: block; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .person-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 14px; }
  .person-stats div { padding: 9px 10px; border-radius: 11px; background: rgba(0, 0, 0, .28); border: 1px solid var(--border); }
  .person-stats small { display: block; font: 600 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .person-stats b { font: 700 17px var(--display); font-variant-numeric: tabular-nums; }
  .person-stats .volt b { color: var(--volt); }
  .person-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .person-foot .grow { flex: 1; font: 500 11.5px var(--mono); color: var(--muted); }

  /* ---- allocation board ---- */
  .alloc { margin-top: 14px; border-radius: 20px; border: 1px solid var(--border); overflow: hidden;
           background: linear-gradient(180deg, var(--surface-2), var(--surface)); box-shadow: var(--shadow); }
  .alloc.unassigned { border-style: dashed; }
  .alloc > header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .alloc > header .avatar { width: 36px; height: 36px; border-radius: 12px; }
  .alloc > header .txt { flex: 1; min-width: 0; }
  .alloc > header b { display: block; font: 600 15px var(--display); overflow-wrap: anywhere; }
  .alloc > header span.m { font-size: 12.5px; color: var(--muted); }
  .strip { display: grid; grid-template-columns: 14px minmax(150px, 1.4fr) 150px 120px minmax(190px, 1.2fr) auto; gap: 14px; align-items: center;
           padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .strip:last-child { border-bottom: 0; }
  .strip:hover { background: rgba(255, 255, 255, .015); }
  .sdot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle-dot); }
  .sdot.ok { background: var(--volt); box-shadow: 0 0 10px var(--volt); } .sdot.warn { background: var(--warn); }
  .sdot.bad { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  .strip .nm a { font: 600 14.5px var(--display); color: var(--text); }
  .strip .nm div { font: 500 11.5px var(--mono); color: var(--muted); margin-top: 1px; }
  .vbar { font: 600 12px var(--mono); color: var(--muted); }
  .vbar b { color: var(--text); font-size: 13px; }
  .vbar i { display: block; height: 4px; margin-top: 5px; border-radius: 99px; background: var(--surface-3); position: relative; overflow: hidden; }
  .vbar i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); background: var(--c, var(--volt)); border-radius: inherit; }
  .code { display: inline-flex; align-items: center; gap: 6px; font: 600 12.5px var(--mono); letter-spacing: .08em; padding: 5px 9px;
          border-radius: 8px; background: rgba(0, 0, 0, .35); border: 1px solid var(--border); cursor: pointer; color: var(--text); }
  .code:hover { border-color: var(--volt); }
  .code svg { width: 12px; height: 12px; color: var(--muted); }
  .strip select { padding: 8px 10px; font-size: 13px; }
  .strip .acts { display: flex; gap: 6px; justify-content: flex-end; }
  .shield-ico { display: inline-flex; color: var(--shield); } .shield-ico.exposed { color: var(--bad); } .shield-ico.unknown { color: var(--faint); }
  .shield-ico svg { width: 15px; height: 15px; }

  /* ---- activity timeline ---- */
  .feed { position: relative; padding: 6px 0 0 4px; }
  .feed::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 1px; background: var(--border); }
  .day { position: relative; margin: 18px 0 8px 44px; font: 600 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .day:first-child { margin-top: 0; }
  .ev { position: relative; display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: start; padding: 10px 14px 10px 0; }
  .ev-ico { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
            background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
  .ev-ico svg { width: 16px; height: 16px; }
  .ev.auth .ev-ico { color: var(--shield); border-color: rgba(56, 225, 255, .25); background: var(--shield-dim); }
  .ev.station .ev-ico { color: var(--volt); border-color: rgba(200, 255, 61, .25); background: var(--volt-dim); }
  .ev.admin .ev-ico { color: var(--warn); border-color: rgba(255, 181, 71, .25); background: var(--warn-soft); }
  .ev.fail .ev-ico { color: var(--bad); border-color: rgba(255, 84, 104, .3); background: var(--bad-soft); }
  .ev-body { min-width: 0; padding-top: 2px; }
  .ev-title { font-size: 14px; overflow-wrap: anywhere; }
  .ev-title b { font-weight: 600; }
  .ev-title .t { font-family: var(--mono); font-size: 13px; color: var(--volt); }
  .ev.fail .ev-title .t { color: var(--bad); }
  .ev-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .ev-time { text-align: right; font: 500 11.5px var(--mono); color: var(--muted); white-space: nowrap; padding-top: 3px; }
  .ev-time span { display: block; color: var(--faint); font-size: 10.5px; margin-top: 2px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr 1fr 110px auto; gap: 10px; align-items: end; margin-bottom: 18px; }
  .filters label { margin-top: 0; }

  @media (max-width: 980px) {
    .strip { grid-template-columns: 14px 1fr auto; }
    .strip .vbar, .strip .codecell { display: none; }
    .strip .assign { grid-column: 2 / -1; }
    .strip .acts { grid-column: 2 / -1; justify-content: flex-start; }
  }
  @media (max-width: 720px) {
    .console { grid-template-columns: 1fr; }
    .kpis { display: grid; grid-template-columns: 1fr 1fr; }
    .filters { grid-template-columns: 1fr 1fr; }
    .ev { grid-template-columns: 36px 1fr; } .ev-time { grid-column: 2; text-align: left; padding: 0; }
    .ev-time span { display: inline; margin-left: 6px; }
  }
</style>
</head>
<body>
<main>
  <section class="console">
    <div>
      <div class="eyebrow">Admin console · <span class="live" style="font-size:11px">live</span></div>
      <h1>Operations</h1>
      <div class="sub" style="margin-top:6px">People, station ownership and everything that happened.</div>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Hosts</small><b id="kHosts">–</b></div>
      <div class="kpi volt"><small>Online</small><b id="kOnline">–</b></div>
      <div class="kpi"><small>Stations</small><b id="kStations">–</b></div>
      <div class="kpi warn"><small>Unassigned</small><b id="kFree">–</b></div>
    </div>
  </section>

  <div class="tabs" role="tablist">
    <button data-tab="users" class="on">Accounts<span class="n" id="nUsers"></span></button>
    <button data-tab="stations">Stations<span class="n" id="nStations"></span></button>
    <button data-tab="audit">Activity</button>
  </div>
  <div class="msg" id="msg" style="margin-top:-10px"></div>

  <!-- Accounts -->
  <section id="tab-users">
    <div class="bar">
      <div class="seg" id="roleSeg">
        <button data-role="host" class="on">Hosts</button><button data-role="admin">Admins</button><button data-role="">Everyone</button>
      </div>
      <div class="grow"></div>
      <div class="search"><input id="userQ" placeholder="Search name or email" autocomplete="off"></div>
    </div>
    <div class="people" id="people"></div>
    <div class="hint" style="margin-top:14px">Deactivating an account logs it out at once and blocks new logins.
      Admin accounts are made on the server with <span class="mono">scripts/create_admin.py</span>.</div>
  </section>

  <!-- Stations: allocation board -->
  <section id="tab-stations" class="hidden">
    <div class="bar">
      <select id="stFilter" style="width:auto;min-width:260px" aria-label="Show stations of"><option value="all">All hosts</option></select>
      <div class="grow"></div>
      <span class="hint" style="margin:0">Click a pairing code to copy it.</span>
    </div>
    <div id="stGroups"></div>
  </section>

  <!-- Activity -->
  <section id="tab-audit" class="hidden">
    <form id="auditForm" class="card filters">
      <div><label for="auUser">Account</label><select id="auUser"><option value="">Anyone</option></select></div>
      <div><label for="auAction">Action</label><select id="auAction"><option value="">Any action</option></select></div>
      <div><label for="auTarget">Station ID or email</label><input id="auTarget" placeholder="e.g. station-01"></div>
      <div><label for="auLimit">Show</label><select id="auLimit"><option>50</option><option selected>200</option><option>1000</option></select></div>
      <button class="primary">Apply</button>
    </form>
    <div class="card"><div class="feed" id="feed"></div></div>
  </section>
</main>

<script src="common.js?v=4"></script>
<script>
let me, hosts = [], users = [], devices = [], current = "users";
const msg = (t, ok) => showMsg($("msg"), t, ok);
const SVG = (d, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const I = {
  search: SVG('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  copy: SVG('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'),
  key: SVG('<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M16 7l3 3"/>'),
  user: SVG('<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'),
  lock: SVG('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  plug: SVG('<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/>'),
  move: SVG('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  alert: SVG('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'),
  gear: SVG('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  send: SVG('<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>'),
};

// ---------------- shared data
async function loadAll() {
  [users, devices] = await Promise.all([api("/api/admin/users"), api("/api/devices")]);
  hosts = users.filter(u => u.role === "host");
  $("kHosts").textContent = hosts.length;
  $("kStations").textContent = devices.length;
  $("kOnline").textContent = devices.filter(d => d.online).length;
  $("kFree").textContent = devices.filter(d => !d.owner_id).length;
  $("nUsers").textContent = users.length;
  $("nStations").textContent = devices.length;
}

// ---------------- tabs
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
async function showTab(name) {
  current = name;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  ["users", "stations", "audit"].forEach(t => $("tab-" + t).classList.toggle("hidden", t !== name));
  msg("");
  history.replaceState(null, "", "#" + name);
  await refresh();
}
async function refresh() {
  try { await loadAll(); } catch (e) { return msg(e.message); }
  ({ users: renderUsers, stations: renderStations, audit: loadAudit })[current]();
}

// ---------------- accounts: people cards
let role = "host";
$("roleSeg").querySelectorAll("button").forEach(b => b.onclick = () => {
  role = b.dataset.role;
  $("roleSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  renderUsers();
});
$("userQ").oninput = () => renderUsers();
document.querySelector(".search").insertAdjacentHTML("afterbegin", I.search);

function renderUsers() {
  const q = $("userQ").value.trim().toLowerCase();
  const list = users.filter(u => (!role || u.role === role) &&
    (!q || u.email.toLowerCase().includes(q) || u.full_name.toLowerCase().includes(q)));
  if (!list.length) { $("people").innerHTML = `<div class="empty-state" style="grid-column:1/-1"><b>No accounts</b>Nothing matches this filter.</div>`; return; }
  $("people").innerHTML = list.map(u => {
    const mine = devices.filter(d => d.owner_id === u.id), online = mine.filter(d => d.online);
    const watts = online.reduce((s, d) => s + Math.max(0, d.power_mw || 0), 0) / 1000;
    const isHost = u.role === "host";
    return `<article class="person ${u.is_active ? "" : "off"} ${isHost ? "" : "admin"}">
      <div class="person-top">${avatar(u.full_name, u.email)}
        <div class="txt"><b>${esc(u.full_name)}</b><span>${esc(u.email)}</span></div>
        ${isHost ? `<span class="pill ${u.is_active ? "ok" : "bad"}">${u.is_active ? "Active" : "Off"}</span>` : `<span class="chip" style="color:var(--volt)">ADMIN</span>`}
      </div>
      ${isHost ? `<div class="person-stats">
        <div><small>Stations</small><b>${mine.length}</b></div>
        <div><small>Online</small><b>${online.length}</b></div>
        <div class="volt"><small>Power</small><b>${watts.toFixed(1)}W</b></div>
      </div>` : `<div style="height:14px"></div>`}
      <div class="person-foot">
        <span class="grow">${u.last_login_at ? "seen " + fmtTs(u.last_login_at) : "never logged in"}</span>
        <button class="sm" data-rename="${u.id}">Rename</button>
        ${u.id === me.id ? "" : `<button class="sm ${u.is_active ? "danger" : ""}" data-active="${u.id}" data-to="${!u.is_active}">${u.is_active ? "Deactivate" : "Activate"}</button>`}
      </div>
    </article>`;
  }).join("");

  $("people").querySelectorAll("[data-active]").forEach(b => b.onclick = async () => {
    const u = users.find(x => x.id == b.dataset.active), to = b.dataset.to === "true";
    if (!to && !confirm(`Deactivate ${u.email}? They are logged out at once.`)) return;
    try { await api(`/api/admin/users/${u.id}`, { method: "PATCH", body: { is_active: to } });
          msg(`${u.email} ${to ? "activated" : "deactivated"}.`, true); refresh(); }
    catch (e) { msg(e.message); }
  });
  $("people").querySelectorAll("[data-rename]").forEach(b => b.onclick = async () => {
    const u = users.find(x => x.id == b.dataset.rename);
    const name = prompt("New name for " + u.email, u.full_name);
    if (!name || !name.trim() || name.trim() === u.full_name) return;
    try { await api(`/api/admin/users/${u.id}`, { method: "PATCH", body: { full_name: name.trim() } });
          msg("Renamed.", true); refresh(); }
    catch (e) { msg(e.message); }
  });
}

// ---------------- stations: allocation board
function shieldIco(d) {
  const b = d.online ? d.data_blocked : null;
  return `<span class="shield-ico ${b === true ? "" : b === false ? "exposed" : "unknown"}" title="${b === true ? "Data lines blocked" : b === false ? "DATA EXPOSED" : "Shield unknown"}">${ICON.shield}</span>`;
}

function strip(d) {
  const level = d.online ? stateClass(d.state) : "bad";
  const v = d.voltage_v, w = v == null ? 0 : Math.min(100, v / 6 * 100);
  const vc = { ok: "var(--volt)", warn: "var(--warn)", bad: "var(--bad)" }[level] || "var(--idle-dot)";
  const opts = [`<option value="">— nobody —</option>`].concat(hosts.map(h =>
    `<option value="${h.id}" ${h.id === d.owner_id ? "selected" : ""}>${esc(h.email)}${h.is_active ? "" : " (off)"}</option>`));
  return `<div class="strip">
    <span class="sdot ${level}" title="${esc(STATE_LABEL[d.state] || d.state)}"></span>
    <div class="nm"><a href="station.html?id=${encodeURIComponent(d.id)}">${esc(d.name || d.id)}</a>
      <div>${esc(d.id)} · ${d.last_seen ? ago(d.seconds_since_seen) : "never seen"}${d.added_at ? " · added " + parseTs(d.added_at).toLocaleDateString() : ""}</div></div>
    <div class="vbar" style="--w:${d.online ? w : 0}%;--c:${vc}"><b>${v == null ? "–" : v.toFixed(2)}</b> V &nbsp;${shieldIco(d)}<i></i></div>
    <div class="codecell"><span class="code" data-copy="${esc(d.pairing_code || "")}" title="Copy pairing code">${esc(d.pairing_code || "–")}${I.copy}</span></div>
    <div class="assign"><select data-assign="${esc(d.id)}" data-was="${d.owner_id ?? ""}" aria-label="Host for ${esc(d.id)}">${opts.join("")}</select></div>
    <div class="acts"><button class="sm ghost" data-code="${esc(d.id)}" title="New pairing code">${I.key}New code</button></div>
  </div>`;
}

function alloc(head, list, emptyText, cls = "") {
  return `<section class="alloc ${cls}"><header>${head}<span class="chip">${list.length} station${list.length === 1 ? "" : "s"}</span></header>
    ${list.length ? list.map(strip).join("") : `<div class="muted" style="padding:14px 18px">${emptyText}</div>`}</section>`;
}

function renderStations() {
  const sel = $("stFilter"), want = sel.value || "all";
  sel.innerHTML = `<option value="all">All hosts</option>` + hosts.map(h => `<option value="${h.id}">${esc(h.email)}</option>`).join("") +
    `<option value="none">Not assigned to a host</option>`;
  sel.value = [...sel.options].some(o => o.value === want) ? want : "all";
  const show = sel.value;
  const byOwner = new Map();
  devices.forEach(d => { const k = d.owner_id ?? "none"; byOwner.set(k, [...(byOwner.get(k) || []), d]); });

  const out = [];
  const unowned = byOwner.get("none") || [];
  if (show === "none" || (show === "all" && unowned.length)) out.push(alloc(
    `<span class="avatar" style="background:var(--surface-3);color:var(--warn)">!</span><span class="txt"><b>Not assigned to a host</b><span class="m">Pick a host on the right, or let a host add it by ID</span></span>`,
    unowned, "Every station has a host.", "unassigned"));
  hosts.filter(h => show === "all" || String(h.id) === show).forEach(h => out.push(alloc(
    `${avatar(h.full_name, h.email)}<span class="txt"><b>${esc(h.email)}</b><span class="m">${esc(h.full_name)}${h.is_active ? "" : " · deactivated"}</span></span>`,
    byOwner.get(h.id) || [], "No stations yet.")));
  $("stGroups").innerHTML = out.join("") || `<div class="empty-state"><b>No hosts yet</b>Hosts create their own account on the login page.</div>`;

  $("stGroups").querySelectorAll("[data-assign]").forEach(s => s.onchange = async () => {
    const id = s.dataset.assign, userId = s.value ? Number(s.value) : null;
    const who = userId ? s.selectedOptions[0].textContent : "nobody";
    if (!confirm(`Move ${id} to ${who}?`)) { s.value = s.dataset.was; return; }
    try { await api(`/api/admin/devices/${encodeURIComponent(id)}/assign`, { method: "POST", body: { user_id: userId } });
          msg(`${id} moved to ${who}.`, true); refresh(); }
    catch (e) { msg(e.message); s.value = s.dataset.was; }
  });
  $("stGroups").querySelectorAll("[data-code]").forEach(b => b.onclick = async () => {
    const id = b.dataset.code;
    if (!confirm(`Make a new pairing code for ${id}? The old code stops working.`)) return;
    try { const d = await api(`/api/admin/devices/${encodeURIComponent(id)}/pairing-code`, { method: "POST" });
          msg(`New pairing code for ${id}: ${d.pairing_code}`, true); refresh(); }
    catch (e) { msg(e.message); }
  });
  $("stGroups").querySelectorAll("[data-copy]").forEach(c => c.onclick = async () => {
    if (!c.dataset.copy) return;
    try { await navigator.clipboard.writeText(c.dataset.copy); msg(`Copied ${c.dataset.copy}.`, true); }
    catch { msg("Copy not allowed here. Select the code and copy it by hand."); }
  });
}
$("stFilter").onchange = renderStations;

// ---------------- activity timeline
const ACTIONS = {
  login: ["auth", I.user, "signed in"],
  login_failed: ["fail", I.lock, "failed to sign in"],
  signup: ["auth", I.user, "created an account"],
  logout_all: ["auth", I.lock, "logged out everywhere"],
  password_changed: ["auth", I.lock, "changed their password"],
  device_added: ["station", I.plug, "added station"],
  device_claimed: ["station", I.plug, "claimed station"],
  claim_failed: ["fail", I.alert, "entered a wrong pairing code for"],
  device_released: ["station", I.plug, "removed station"],
  device_assigned: ["admin", I.move, "reassigned station"],
  device_updated: ["station", I.gear, "changed settings of"],
  command_sent: ["station", I.send, "sent a command to"],
  pairing_code_regenerated: ["admin", I.key, "made a new pairing code for"],
  user_updated: ["admin", I.user, "updated account"],
  incident_acknowledged: ["station", I.alert, "acknowledged a security incident on"],
};
$("auAction").insertAdjacentHTML("beforeend", Object.entries(ACTIONS).map(([k, v]) => `<option value="${k}">${v[2]}</option>`).join(""));

function detailChips(r) {
  const d = r.detail || {};
  const chips = [];
  const email = id => (users.find(u => u.id === id) || {}).email || (id == null ? "nobody" : "#" + id);
  if (r.action === "device_assigned") chips.push(`${email(d.from_user_id)} → ${email(d.to_user_id)}`);
  else if (r.action === "device_added") chips.push(d.new ? "new station" : "was already sending");
  else if (r.action === "command_sent" && d.command) chips.push(d.command);
  else Object.entries(d).forEach(([k, v]) => v != null && chips.push(`${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`));
  if (r.client_ip) chips.push(r.client_ip);
  return chips.map(c => `<span class="chip">${esc(c)}</span>`).join("");
}

async function loadAudit() {
  try {
    if ($("auUser").options.length === 1)
      $("auUser").insertAdjacentHTML("beforeend", users.map(u => `<option value="${u.id}">${esc(u.email)}</option>`).join(""));
    const q = new URLSearchParams({ limit: $("auLimit").value });
    if ($("auUser").value) q.set("user_id", $("auUser").value);
    if ($("auAction").value) q.set("action", $("auAction").value);
    if ($("auTarget").value.trim()) q.set("target", $("auTarget").value.trim());
    const rows = await api("/api/admin/audit?" + q);
    if (!rows.length) { $("feed").innerHTML = `<div class="muted" style="padding:20px 44px">Nothing matches.</div>`; return; }
    let lastDay = "";
    $("feed").innerHTML = rows.map(r => {
      const t = parseTs(r.ts), day = t.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
      const [cls, ico, verb] = ACTIONS[r.action] || ["", I.gear, r.action];
      const head = day !== lastDay ? `<div class="day">${esc(day)}</div>` : "";
      lastDay = day;
      const isStation = /^device_|^command|^claim|^pairing/.test(r.action);
      return `${head}<div class="ev ${cls}">
        <span class="ev-ico">${ico}</span>
        <div class="ev-body">
          <div class="ev-title"><b>${esc(r.user_email || "Someone")}</b> ${esc(verb)} ${r.target ? (isStation
            ? `<a class="t" href="station.html?id=${encodeURIComponent(r.target)}">${esc(r.target)}</a>` : `<span class="t">${esc(r.target)}</span>`) : ""}</div>
          <div class="ev-meta">${detailChips(r)}</div>
        </div>
        <div class="ev-time">${ago((Date.now() - t) / 1000)}<span>${t.toLocaleTimeString()}</span></div>
      </div>`;
    }).join("");
  } catch (e) { msg(e.message); }
}
$("auditForm").onsubmit = e => { e.preventDefault(); loadAudit(); };

(async () => {
  me = await requireLogin({ adminOnly: true, active: "admin" });
  const start = location.hash.slice(1);
  await showTab(["users", "stations", "audit"].includes(start) ? start : "users");
  setInterval(() => { if (current !== "audit" && !document.activeElement.matches("select, input")) refresh(); }, 5000);
})();
